name: Release npm (prgenie)

# Prepare only — maintainers publish manually after reviewing the tarball (no auto publish on tag).
on:
  push:
    tags:
      - "prgenie-v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check-versions
      - run: pnpm test
      - run: pnpm pack:runner
      - name: npm publish dry-run (provenance-ready, does not publish)
        working-directory: packages/npm-prgenie
        run: npm publish --dry-run --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
